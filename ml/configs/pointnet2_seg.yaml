{
  "model": {
    "num_classes": 6,
    "in_channels": 4,
    "input_points": 8192,
    "sa1_points": 512,
    "sa2_points": 128,
    "neighbors": 16,
    "hidden_channels": 64,
    "dropout": 0.1,
    "class_names": ["background", "Box", "ELFplusplus", "CargoBike", "FTS", "ForkLift"],
    "preprocessing": {
      "voxel": 0.0,
      "remove_ground": false,
      "plane_distance": 0.05,
      "max_ground_tilt_deg": 25.0,
      "ground_quantile": 0.3,
      "remove_outliers": false,
      "outlier_neighbors": 12,
      "outlier_std_ratio": 2.5
    },
    "calibration": {}
  },
  "training": {
    "epochs": 20,
    "batch_size": 4,
    "learning_rate": 0.001,
    "weight_decay": 0.0001,
    "validation_fraction": 0.2,
    "test_fraction": 0.1,
    "seed": 42,
    "device": "auto",
    "score_threshold": 0.5,
    "checkpoint_every": 1
  }
}
