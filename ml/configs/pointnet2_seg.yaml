  "training": {
    "epochs": 20,
    "batch_size": 4,
    "learning_rate": 0.001,
    "weight_decay": 0.0001,
    "validation_fraction": 0.2,
    "seed": 42,
    "device": "auto",
    "score_threshold": 0.5,
    "checkpoint_every": 1
  }
}
