{
  "model": {
    "num_classes": 6,
    "in_channels": 4,
    "input_points": 4096,
    "sa1_points": 256,
    "sa2_points": 64,
    "neighbors": 16,
    "hidden_channels": 64,
    "dropout": 0.1,
    "class_names": ["background", "Box", "ELFplusplus", "CargoBike", "FTS", "ForkLift"]
